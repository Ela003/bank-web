name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get code
        uses: actions/checkout@v6

      - name: Check HTML file
        run: test -f index.html

      - name: Check JavaScript file
        run: test -f script.js

      - name: CI successful
        run: echo "All checks passed"